<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d10">
<title>Kravos Sports</title>
<style>
:root{--bg:#0b0d10;--card:#14181d;--card2:#1b2027;--line:#252b33;--tx:#eef1f5;--dim:#8b95a3;--acc:#3ddc84;--live:#ff4d4f;--home:#4da3ff;--away:#ffb04d}
@media (prefers-color-scheme: light){:root{--bg:#f3f5f8;--card:#fff;--card2:#eef1f5;--line:#dde2e9;--tx:#12161b;--dim:#677282;--acc:#0d9f55;--live:#d92d30;--home:#1d6fd1;--away:#d97a0a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 40px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:0 2px 8px}
.brand b{font-size:18px;letter-spacing:.2px}
.brand small{color:var(--dim)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx);font-weight:600}
.dates{display:flex;gap:6px;align-items:center;padding-top:2px}
.dates .nav{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;line-height:1}
.dates .day{flex:1;text-align:center;font-weight:600}
.dates .day small{display:block;font-weight:400;color:var(--dim);font-size:12px}
.tog{padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-size:13px}
.tog.on{border-color:var(--live);color:var(--live)}
.lg{background:var(--card);border-radius:14px;margin:12px 0;overflow:hidden;border:1px solid var(--line)}
.lg h3{margin:0;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px;background:var(--card2);color:var(--dim);font-weight:600;cursor:default}
.lg h3 img{width:18px;height:18px;object-fit:contain}
.lg h3 span.c{font-weight:400;opacity:.8}
.lg h3 a{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.ev{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.ev:hover{background:var(--card2)}
.st{font-size:12px;color:var(--dim);text-align:center;line-height:1.2}
.st.live{color:var(--live);font-weight:700}
.tm{display:flex;align-items:center;gap:8px;min-width:0;height:24px}
.tm img{width:20px;height:20px;object-fit:contain;flex:none}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm.w span{font-weight:700}
.tm.l span{color:var(--dim)}
.sc{display:flex;flex-direction:column;align-items:flex-end;gap:0;font-variant-numeric:tabular-nums;min-width:48px}
.sc div{height:24px;display:flex;gap:10px;align-items:center;font-weight:700}
.sc i{font-style:normal;color:var(--dim);font-weight:400;font-size:13px}
.rd{display:inline-block;width:8px;height:11px;background:var(--live);border-radius:2px;margin-left:2px}
.empty,.err{color:var(--dim);text-align:center;padding:48px 12px}
.err{color:var(--live)}
.spin{opacity:.6}
.race{padding:6px 12px 10px;border-top:1px solid var(--line)}
.race div{display:flex;gap:10px;padding:3px 0}
.race b{width:22px;color:var(--dim);font-weight:600}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;padding:10px 2px;color:var(--dim)}
.hd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.hd .lgn{color:var(--dim);font-size:13px;margin-bottom:10px}
.hd .row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.hd .t{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.hd .t img{width:52px;height:52px;object-fit:contain}
.hd .t b{font-size:14px;overflow-wrap:anywhere}
.hd .big{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hd .big small{display:block;font-size:13px;font-weight:600;color:var(--dim)}
.hd .big.live small{color:var(--live)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:12px}
.inc{display:grid;grid-template-columns:1fr 44px 1fr;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.inc:first-child{border-top:0}
.inc .m{text-align:center;color:var(--dim);font-size:12px}
.inc .l{text-align:right}
.inc small{display:block;color:var(--dim);font-size:12px}
.inc.per{display:block;text-align:center;color:var(--dim);font-size:12px;padding:6px 0}
.stg{padding:8px 0}
.stg h4{margin:10px 0 4px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.stat .v{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.stat .nm{color:var(--dim);font-size:13px}
.bar{display:flex;gap:4px;height:5px;margin:3px 0 9px}
.bar>div{flex:1;background:var(--card2);border-radius:3px;overflow:hidden;display:flex}
.bar>div:first-child{justify-content:flex-end}
.bar i{display:block;height:100%}
.lu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lu h4{margin:10px 0 6px;font-size:12px;color:var(--dim)}
.pl{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:14px}
.pl em{font-style:normal;width:22px;color:var(--dim);text-align:right;flex:none}
.pl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl b{font-size:12px;padding:1px 5px;border-radius:5px;background:var(--card2)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{color:var(--dim);font-weight:500;font-size:12px;text-align:right;padding:6px 4px}
td{padding:7px 4px;text-align:right;border-top:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child,th:first-child{text-align:left;width:26px}
td.tn{display:flex;gap:8px;align-items:center;border:0}
td.tn img{width:18px;height:18px;object-fit:contain}
tr.z td:first-child{box-shadow:inset 3px 0 0 var(--zc,transparent)}
.box{overflow-x:auto;margin:0 -12px;padding:0 12px}
.box table{min-width:620px;font-size:13px}
.box th,.box td{white-space:nowrap;padding:6px 5px}
.box td:nth-child(2),.box th:nth-child(2){position:sticky;left:0;background:var(--card);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.box tr.st td{font-weight:600}
.box td:first-child,.box th:first-child{width:24px;color:var(--dim)}
details.pp{border-top:1px solid var(--line)}
details.pp summary{list-style:none;display:grid;grid-template-columns:1fr 40px 34px 26px 26px;gap:6px;align-items:center;padding:8px 0;cursor:pointer;font-size:14px;font-variant-numeric:tabular-nums}
details.pp summary::-webkit-details-marker{display:none}
details.pp summary span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.pp summary b,details.pp summary em{text-align:right;font-style:normal}
details.pp summary .r{font-size:12px;padding:1px 5px;border-radius:5px;color:#fff;text-align:center}
.pph{display:grid;grid-template-columns:1fr 40px 34px 26px 26px;gap:6px;font-size:11px;color:var(--dim);padding:8px 0 4px;text-align:right}
.pph span:first-child{text-align:left}
.ppd{padding:0 0 10px;font-size:13px}
.ppd h5{margin:8px 0 2px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.ppd div{display:flex;justify-content:space-between;padding:2px 0}
.ppd div span:first-child{color:var(--dim)}
.note{color:var(--dim);font-size:12px;text-align:center;padding:16px 0}
.sets{display:flex;gap:10px;justify-content:center;margin-top:8px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><b>Kravos Sports</b><small id="upd"></small></div>
    <div class="chips" id="sports"></div>
    <div class="dates" id="dates"></div>
  </header>
  <main id="main"></main>
  <div class="note">Podaci: FotMob, ESPN, EuroLeague. Samo za lične potrebe.</div>
</div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
const sameDay = (a, b) => ymd(a) === ymd(b);
const hhmm = ms => new Date(ms).toLocaleTimeString("sr-Latn-RS", { hour: "2-digit", minute: "2-digit" });
const num = v => (v === null || v === undefined || v === "" ? null : Number(v));
const TZ = encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Belgrade");

const cache = new Map(), inflight = new Map();
async function getJSON(url, ttl = 30) {
  const hit = cache.get(url);
  if (hit && Date.now() - hit.t < ttl * 1000) return hit.v;
  if (inflight.has(url)) return inflight.get(url);
  const p = fetch(url).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(v => { cache.set(url, { t: Date.now(), v }); return v; })
    .finally(() => inflight.delete(url));
  inflight.set(url, p);
  return p;
}

/* ---------- sports ---------- */
const SPORTS = [
  { id: "football", label: "Fudbal" },
  { id: "basketball", label: "Košarka" },
  { id: "tennis", label: "Tenis" },
  { id: "hockey", label: "Hokej" },
  { id: "f1", label: "Formula 1" },
  { id: "mma", label: "MMA (UFC)" },
  { id: "nfl", label: "NFL" },
  { id: "mlb", label: "MLB" },
];
const ESPN = {
  basketball: ["basketball/nba"], tennis: ["tennis/atp", "tennis/wta"], hockey: ["hockey/nhl"],
  f1: ["racing/f1"], mma: ["mma/ufc"], nfl: ["football/nfl"], mlb: ["baseball/mlb"],
};
const ESPN_BASE = "https://site.api.espn.com/apis/site/v2/sports";
const FM = "https://www.fotmob.com/api/data";
const fmTeamLogo = id => `https://images.fotmob.com/image_resources/logo/teamlogo/${id}_small.png`;
const fmLeagueLogo = id => `https://images.fotmob.com/image_resources/logo/leaguelogo/${id}.png`;

/* ---------- state ---------- */
const state = { sport: "football", date: new Date(), liveOnly: false, events: [], loading: false, error: null };
try { const s = localStorage.getItem("ks.sport"); if (SPORTS.some(x => x.id === s)) state.sport = s; } catch (e) {}

/* ---------- data: FotMob ---------- */
function fmStatus(st) {
  if (!st) return { k: "ns" };
  const short = st.reason && st.reason.short;
  if (st.cancelled) return { k: "x", label: (st.reason && st.reason.long) || "Otkazano" };
  if (st.finished) return { k: "ft", label: short === "AET" ? "Prod." : short === "Pen" ? "Pen." : "Kraj" };
  if (st.ongoing || st.started) {
    const lt = st.liveTime && st.liveTime.short ? String(st.liveTime.short).replace(/[\u200e\u200f]/g, "").replace("’", "'") : null;
    return { k: "live", label: lt || (short === "HT" ? "Poluvreme" : "Uživo") };
  }
  return { k: "ns" };
}
const scoreStr = s => { const p = String(s || "").split("-").map(x => parseInt(x.trim(), 10)); return [isNaN(p[0]) ? null : p[0], isNaN(p[1]) ? null : p[1]]; };

async function fmDay(date) {
  const today = sameDay(date, new Date());
  const j = await getJSON(`${FM}/matches?date=${ymd(date)}&timezone=${TZ}&ccode3=SRB`, today ? 8 : 300);
  const out = [];
  for (const lg of j.leagues || []) {
    const pid = lg.primaryId || lg.id;
    const league = { key: "fm:" + pid, name: lg.name, country: lg.ccode, logo: fmLeagueLogo(pid), link: "#/l/" + pid, gid: "fm:" + lg.id };
    for (const m of lg.matches || []) {
      const st = fmStatus(m.status);
      let [hs, as] = scoreStr(m.status && m.status.scoreStr);
      if (hs === null) hs = num(m.home && m.home.score);
      if (as === null) as = num(m.away && m.away.score);
      if (st.k === "ns") { hs = as = null; }
      out.push({
        key: "fm:" + m.id, href: "#/m/fm/" + m.id, sport: "football", league, st,
        start: m.status && m.status.utcTime ? Date.parse(m.status.utcTime) : (m.timeTS || 0),
        home: { name: m.home.longName || m.home.name, logo: fmTeamLogo(m.home.id) },
        away: { name: m.away.longName || m.away.name, logo: fmTeamLogo(m.away.id) },
        hs, as, hpen: num(m.home.penScore), apen: num(m.away.penScore),
        hred: num(m.home.redCards) || 0, ared: num(m.away.redCards) || 0,
      });
    }
  }
  return out;
}

/* ---------- data: ESPN ---------- */
function espnStatus(s) {
  const t = s && s.type; if (!t) return { k: "ns" };
  if (t.state === "post") return /CANCEL|POSTPONED/.test(t.name || "") ? { k: "x", label: t.description } : { k: "ft", label: "Kraj" };
  if (t.state === "in") return { k: "live", label: t.shortDetail || s.displayClock || "Uživo" };
  return { k: "ns" };
}
const SESSION = { FP1: "1. trening", FP2: "2. trening", FP3: "3. trening", Qual: "Kvalifikacije", Race: "Trka", Sprint: "Sprint", SQ: "Sprint kval.", SS: "Sprint kval." };

function espnEvents(root, sport, path, date) {
  const lg0 = (root.leagues || [])[0] || {};
  const base = { key: "espn:" + path, name: lg0.name || path, country: sport === "f1" || sport === "mma" ? "INT" : "USA", logo: lg0.logos && lg0.logos[0] && lg0.logos[0].href };
  const out = [];
  const start = c => Date.parse(String(c.date || c.startDate || "").replace(/^(\d{4}-\d\d-\d\dT\d\d:\d\d)Z$/, "$1:00Z"));
  for (const ev of root.events || []) {
    let comps = ev.competitions || [];
    let gname = null;
    if (!comps.length && ev.groupings) {
      // tennis: tournament -> draws -> matches
      for (const g of ev.groupings) for (const c of g.competitions || []) out.push(...espnComp(c, ev, g.grouping && g.grouping.displayName));
      continue;
    }
    for (const c of comps) out.push(...espnComp(c, ev, null));
  }
  function espnComp(c, ev, draw) {
    const st = espnStatus(c.status || ev.status);
    const cs = c.competitors || [];
    const league = Object.assign({}, base, {
      name: sport === "tennis" ? (ev.name + (draw ? " · " + draw : "")) : (sport === "f1" || sport === "mma") ? ev.name : base.name,
      key: sport === "tennis" || sport === "f1" || sport === "mma" ? "espn:" + ev.id + (draw || "") : base.key,
    });
    const ms = start(c);
    if (sport === "f1") {
      const abbr = (c.type && c.type.abbreviation) || "";
      const res = cs.map(r => ({ pos: r.order, name: r.athlete && r.athlete.displayName, team: r.team && r.team.displayName })).sort((a, b) => a.pos - b.pos);
      return [{ key: `espn:${path}:${ev.id}:${c.id}`, href: `#/m/espn/${path}/${ev.id}`, sport, league, st, start: ms, f1: true,
        title: (ev.shortName || ev.name) + " · " + (SESSION[abbr] || abbr), race: res }];
    }
    if (cs.length < 2) return [];
    const side = h => cs.find(x => x.homeAway === (h ? "home" : "away")) || cs[h ? 0 : 1];
    const h = side(true), a = side(false);
    const who = o => {
      const t = o.team, at = o.athlete;
      if (t) return { name: t.displayName, logo: t.logo };
      return { name: at && (at.displayName || at.shortName), logo: at && at.flag && at.flag.href };
    };
    const ls = o => (o.linescores || []).map(x => num(x.value)).filter(x => x !== null);
    const ns = st.k === "ns";
    return [{ key: `espn:${path}:${c.id || ev.id}`, href: `#/m/espn/${path}/${c.id || ev.id}`, sport, league, st, start: ms,
      home: who(h), away: who(a),
      hs: ns || sport === "mma" ? null : num(h.score), as: ns || sport === "mma" ? null : num(a.score),
      sets: sport === "tennis" && !ns ? [ls(h), ls(a)] : null,
      win: h.winner ? 1 : a.winner ? 2 : 0, note: sport === "mma" ? (c.type && c.type.abbreviation) : null }];
  }
  if (sport === "f1" || sport === "mma") return out.filter(e => sameDay(new Date(e.start), date));
  return out;
}
async function espnDay(sport, date) {
  const today = sameDay(date, new Date());
  const wide = sport === "f1" || sport === "mma";
  const q = wide ? `${ymd(new Date(date.getTime() - 3 * 864e5))}-${ymd(new Date(date.getTime() + 3 * 864e5))}` : ymd(date);
  const res = await Promise.allSettled(ESPN[sport].map(p => getJSON(`${ESPN_BASE}/${p}/scoreboard?dates=${q}`, today ? 8 : 300).then(r => espnEvents(r, sport, p, date))));
  const ok = res.filter(r => r.status === "fulfilled");
  if (!ok.length) throw res[0].reason;
  return ok.flatMap(r => r.value);
}

/* ---------- data: EuroLeague ---------- */
async function elDay(date) {
  const j = await getJSON("el.json?" + Math.floor(Date.now() / 300000), 120);
  const now = Date.now();
  const evs = j.games.filter(g => g.utc && sameDay(new Date(g.utc), date)).map(g => {
    const start = Date.parse(g.utc);
    const league = { key: "el:" + g.c, name: j.comps[g.c] || g.c, country: "EUR", logo: null };
    return {
      key: `el:${g.c}:${g.code}`, href: `#/m/el/${g.c}/${g.code}`, sport: "basketball", league, start, _season: j.season, _c: g.c, _code: g.code,
      st: g.played ? { k: "ft", label: "Kraj" } : { k: "ns" },
      home: { name: g.h.name, logo: g.h.logo }, away: { name: g.a.name, logo: g.a.logo },
      hs: g.played ? g.hs : null, as: g.played ? g.as : null, sets: g.played ? [g.hp, g.ap] : null,
      round: g.round,
    };
  });
  // live overlay for games that should be running
  await Promise.all(evs.filter(e => e.st.k !== "ft" && e.start <= now + 60000 && now - e.start < 4 * 36e5).map(async e => {
    try {
      const h = await getJSON(`https://live.euroleague.net/api/Header?gamecode=${e._code}&seasoncode=${e._c}${e._season}`, 8);
      const a = num(h.ScoreA), b = num(h.ScoreB);
      const q = [1, 2, 3, 4].map(i => [num(h["ScoreQuarter" + i + "A"]), num(h["ScoreQuarter" + i + "B"])]);
      const per = k => { let prev = 0; const o = []; for (const v of q.map(x => x[k])) { if (!v || v <= 0) break; o.push(v - prev); prev = v; } return o; };
      const live = !!h.Live;
      if (live) {
        const qq = String(h.Quarter || "").trim();
        e.st = { k: "live", label: (/^\d+$/.test(qq) ? "Q" + qq : qq) + " " + String(h.RemainingPartialTime || "").trim() };
        e.hs = a; e.as = b; e.sets = [per(0), per(1)];
      } else if ((a || 0) > 0 && now - e.start > 90 * 60000) {
        e.st = { k: "ft", label: "Kraj" }; e.hs = a; e.as = b; e.sets = [per(0), per(1)];
      }
    } catch (err) { /* keep the schedule row */ }
  }));
  return evs;
}

/* ---------- list view ---------- */
const FM_ORDER = ["fm:42", "fm:73", "fm:10216", "fm:77", "fm:50", "fm:9806", "el:E", "el:U", "fm:182", "fm:9497", "fm:47", "fm:87", "fm:55", "fm:54", "fm:53"];
const BIG = new Set(["ENG", "ESP", "ITA", "GER", "FRA"]);
function tier(l) {
  const i = FM_ORDER.indexOf(l.key); if (i >= 0) return [i < 8 ? 0 : 1, i];
  if (l.country === "SRB") return [1, 20];
  if (l.country === "INT" || l.country === "EUR") return [2, 0];
  if (BIG.has(l.country)) return [3, 0];
  if (/^(atp|wta)/i.test(l.name)) return [2, 5];
  return [4, 0];
}

async function loadEvents() {
  const sp = state.sport, d = new Date(state.date);
  if (sp === "football") return fmDay(d);
  if (sp === "basketball") {
    const r = await Promise.allSettled([elDay(d), espnDay("basketball", d)]);
    const ok = r.filter(x => x.status === "fulfilled");
    if (!ok.length) throw r[0].reason;
    return ok.flatMap(x => x.value);
  }
  return espnDay(sp, d);
}

async function refresh(silent) {
  const my = ++refresh.n;
  if (!silent) { state.loading = true; state.error = null; renderList(); }
  try {
    const ev = await loadEvents();
    if (my !== refresh.n) return;
    state.events = ev; state.error = null;
    $("#upd").textContent = "ažurirano " + hhmm(Date.now());
  } catch (e) {
    if (my !== refresh.n) return;
    if (!silent) { state.events = []; state.error = "Podaci trenutno nisu dostupni (" + e.message + ")"; }
  }
  state.loading = false;
  if (!location.hash || location.hash === "#/") renderList();
}

    return `<div class="inc"><div class="l">${side === "l" ? cell : ""}</div><div class="m">${esc(t)}'</div><div>${side === "r" ? cell : ""}</div></div>`;

function fmPlayers(c, g) {
  const ps = c.playerStats || {};
  const fmt = st => { if (!st || st.value === null || st.value === undefined) return null;
    if (st.total !== undefined && st.total !== null) { const pc = st.total ? Math.round(st.value / st.total * 100) : 0; return `${st.value}/${st.total} (${pc}%)`; }
    return typeof st.value === "number" && !Number.isInteger(st.value) ? st.value.toFixed(2) : String(st.value); };
  const teams = [[g.homeTeam && g.homeTeam.id, g.homeTeam && g.homeTeam.name], [g.awayTeam && g.awayTeam.id, g.awayTeam && g.awayTeam.name]];
  const out = teams.map(([tid, tname]) => {
    const list = Object.values(ps).filter(p => String(p.teamId) === String(tid) && p.stats && p.stats.length).map(p => {
      const groups = p.stats.map(gr => ({ title: psr(gr.title), rows: Object.entries(gr.stats || {}).filter(([k, v]) => v && v.stat && v.stat.type !== "boolean").map(([k, v]) => [psr(k), fmt(v.stat)]).filter(x => x[1] !== null) })).filter(gr => gr.rows.length);
      const get = k => { for (const gr of p.stats) { const v = gr.stats && gr.stats[k]; if (v && v.stat) return v.stat.value; } return null; };
      return { name: p.name, no: p.shirtNumber, r: num(get("FotMob rating")), min: get("Minutes played"), gl: get("Goals") || 0, as: get("Assists") || 0, groups };
    }).sort((a, b) => (b.r || 0) - (a.r || 0));

  const e = {

  };
  const tabs = [["ov", "Pregled"], ["st", "Statistika"], ["pl", "Igrači"], ["lu", "Postave"], ["tb", "Tabela"]];

    const d = j.details || {};
    const fx = ((j.fixtures || {}).allMatches || []);
    const next = fx.filter(x => !(x.status && (x.status.finished || x.status.cancelled))).slice(0, 8);
    const last = fx.filter(x => x.status && x.status.finished).slice(-8).reverse();
    const row = x => { const [a, b] = scoreStr(x.status && x.status.scoreStr); const fin = x.status && x.status.finished;
      return `<a class="ev" href="#/m/fm/${x.id}" style="grid-template-columns:70px 1fr auto"><div class="st">${fin ? "Kraj" : esc(new Date(x.status.utcTime).toLocaleDateString("sr-Latn-RS", { day: "numeric", month: "short" }) + " " + hhmm(Date.parse(x.status.utcTime)))}</div>
      <div><div class="tm"><img src="${fmTeamLogo(x.home.id)}" alt=""><span>${esc(x.home.name)}</span></div><div class="tm"><img src="${fmTeamLogo(x.away.id)}" alt=""><span>${esc(x.away.name)}</span></div></div>
      <div class="sc"><div>${fin ? a ?? "" : ""}</div><div>${fin ? b ?? "" : ""}</div></div></a>`; };
    m.innerHTML = back() + `<div class="hd"><img src="${fmLeagueLogo(id)}" alt="" style="width:56px;height:56px;object-fit:contain"><div style="font-size:18px;font-weight:700;margin-top:6px">${esc(d.name || "")}</div><div class="lgn" style="margin:2px 0 0">${esc(d.selectedSeason || "")}</div></div>
      <div style="height:12px"></div>${renderFmTable(j)}
      ${next.length ? `<section class="lg"><h3>Naredni mečevi</h3>${next.map(row).join("")}</section>` : ""}
      ${last.length ? `<section class="lg"><h3>Poslednji rezultati</h3>${last.map(row).join("")}</section>` : ""}`;
  } catch (err) { m.innerHTML = back() + `<div class="err">Liga nije dostupna (${esc(err.message)})</div>`; }
}

const ESPN_SR = { "FG": "Šut iz igre", "Field Goal %": "Šut iz igre %", "3PT": "Šut za 3", "Three Point %": "Šut za 3 %", "FT": "Slobodna bacanja", "Free Throw %": "Slobodna bacanja %", "Rebounds": "Skokovi", "Offensive Rebounds": "Skokovi u napadu", "Defensive Rebounds": "Skokovi u odbrani", "Assists": "Asistencije", "Steals": "Ukradene lopte", "Blocks": "Blokade", "Turnovers": "Izgubljene lopte", "Team Turnovers": "Timske izgubljene lopte", "Total Turnovers": "Ukupno izgubljenih", "Technical Fouls": "Tehničke greške", "Total Technical Fouls": "Ukupno tehničkih", "Flagrant Fouls": "Nesportske greške", "Turnover Points": "Poeni posle izgubljenih", "Fast Break Points": "Poeni iz kontre", "Points in Paint": "Poeni u reketu", "Fouls": "Faulovi", "Largest Lead": "Najveće vođstvo", "Shots": "Šutevi", "Hits": "Udarci telom", "Faceoffs Won": "Dobijena vbacivanja", "Power Play Goals": "Golovi sa igračem više", "Penalty Minutes": "Kaznene minute", "Takeaways": "Oduzete pakove", "Giveaways": "Izgubljeni pakovi", "Blocked Shots": "Blokirani šutevi", "Saves": "Odbrane" };
const esr = s => ESPN_SR[s] || s;

/* ---------- detail: ESPN ---------- */
async function showEspnMatch(path, id, tab) {
  const m = $("#main");
  if (m.dataset.shown !== location.hash) m.innerHTML = back() + `<div class="empty spin">Učitavam…</div>`;
  m.dataset.shown = location.hash;
  const sport = Object.keys(ESPN).find(k => ESPN[k].includes(path)) || "nfl";
  try {
    if (sport === "f1" || sport === "mma") {
      const root = await getJSON(`${ESPN_BASE}/${path}/scoreboard`, 60);
      const ev = (root.events || []).find(x => String(x.id) === String(id));
      if (!ev) throw new Error("događaj nije pronađen");
      const comps = (ev.competitions || []).slice().sort((a, b) => Date.parse(a.date) - Date.parse(b.date));
      m.innerHTML = back() + `<div class="hd"><div class="lgn">${esc((root.leagues || [])[0]?.name || "")}</div><div style="font-size:18px;font-weight:700">${esc(ev.name)}</div>${ev.circuit ? `<div class="lgn" style="margin-top:4px">${esc(ev.circuit.fullName || "")}</div>` : ""}</div><div style="height:12px"></div>` +
        comps.map(c => {
          const st = espnStatus(c.status);
          const abbr = (c.type && c.type.abbreviation) || "";
          const cs = (c.competitors || []);
          let inner = "";
          if (sport === "f1") inner = cs.slice().sort((a, b) => a.order - b.order).map(r => `<div><b>${r.order}</b><span>${esc(r.athlete && r.athlete.displayName)}</span><span style="color:var(--dim)">${esc(r.team && r.team.displayName || "")}</span></div>`).join("");
          else inner = cs.map(r => `<div><span style="${r.winner ? "font-weight:700" : ""}">${esc(r.athlete && r.athlete.displayName)}</span></div>`).join(" ");
          return `<section class="lg"><h3>${esc(sport === "f1" ? (SESSION[abbr] || abbr) : abbr)} · ${st.k === "ns" ? new Date(c.date).toLocaleString("sr-Latn-RS", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : esc(st.label || "Kraj")}</h3>${st.k !== "ns" && inner ? `<div class="race">${inner}</div>` : ""}</section>`;
        }).join("");
      return;
    }
    const j = await getJSON(`${ESPN_BASE}/${path}/summary?event=${id}`, 8);
    const hc = ((j.header || {}).competitions || [])[0];
    if (!hc) throw new Error("nema podataka");
    const root = { leagues: [], events: [{ id, competitions: [hc] }] };
    const e = espnEvents(root, sport, path, new Date())[0];
    if (!e) throw new Error("nema podataka");
    e.league = { name: ((j.header || {}).league || {}).name || (j.header && j.header.season && "") || sport };
    const teams = ((j.boxscore || {}).teams) || [];
    let stats = "";
    if (teams.length >= 2) {
      const homeFirst = teams[0].team && e.home && String(teams[0].team.displayName) === String(e.home.name);
      const A = homeFirst ? teams[0] : teams[1], B = homeFirst ? teams[1] : teams[0];
      const bm = new Map((B.statistics || []).map(s => [s.label || s.name, s.displayValue]));
      const items = (A.statistics || []).filter(s => bm.has(s.label || s.name)).map(s => ({ name: esr(s.label || s.name), h: s.displayValue, a: bm.get(s.label || s.name) }));
      if (items.length) stats = `<div class="panel">${statsHtml([{ title: "Timovi", items }])}</div>`;
    }
    // player box score: home team first
    const pls = ((j.boxscore || {}).players) || [];
    const ordered = pls.slice().sort((x, y) => (String(x.team && x.team.displayName) === String(e.home.name) ? -1 : 0) - (String(y.team && y.team.displayName) === String(e.home.name) ? -1 : 0));
    const players = ordered.map(t => (t.statistics || []).map(grp => {
      const rows = (grp.athletes || []).filter(a => !a.didNotPlay && a.stats && a.stats.length).map(a => ({ name: a.athlete && a.athlete.displayName, no: a.athlete && a.athlete.jersey, starter: a.starter, v: a.stats }));
      return boxHtml((t.team && t.team.displayName || "") + (t.statistics.length > 1 && grp.name ? " · " + grp.name : ""), grp.labels || [], rows);
    }).join("")).join("");
    const tabs = [["st", "Statistika"], ["pl", "Igrači"]].filter(([k]) => k === "st" || players);
    const cur = tab === "pl" && players ? "pl" : "st";
    const venue = ((j.gameInfo || {}).venue || {}).fullName;
    const body = cur === "pl" ? players : (stats || `<div class="panel"><div class="note">${e.st.k === "ns" ? "Statistika će biti dostupna kad meč počne." : "Detaljna statistika nije dostupna."}</div></div>`);
    m.innerHTML = back() + hdr(e, setsRow(e)) + (tabs.length > 1 ? `<div class="tabs">${tabs.map(([k, l]) => `<a class="chip ${k === cur ? "on" : ""}" href="#/m/espn/${path}/${id}/${k}">${l}</a>`).join("")}</div>` : `<div style="height:12px"></div>`) + body + (venue ? `<div class="note">${esc(venue)}</div>` : "");
    detailTimer(() => showEspnMatch(path, id, cur), e.st.k === "live" ? 10 : 0);
  } catch (err) { m.innerHTML = back() + `<div class="err">Događaj nije dostupan (${esc(err.message)})</div>`; }
}

/* ---------- detail: EuroLeague ---------- */
function elName(x) { const p = String(x || "").split(",").map(t => t.trim()); const cap = t => t.toLowerCase().replace(/(^|[\s-])\S/g, m => m.toUpperCase()); return p.length === 2 ? cap(p[1]) + " " + cap(p[0]) : cap(x || ""); }
function elTeamStats(h, a) {
  const pct = (o, m, at) => { const mm = o[m] || 0, aa = o[at] || 0; return `${mm}/${aa} (${aa ? Math.round(mm / aa * 100) : 0}%)`; };
  const pair = (n, m, at) => ({ name: n, h: pct(h, m, at), a: pct(a, m, at) });
  const one = (n, k) => ({ name: n, h: h[k] ?? 0, a: a[k] ?? 0 });
  return [pair("Šut za 2", "FieldGoalsMade2", "FieldGoalsAttempted2"), pair("Šut za 3", "FieldGoalsMade3", "FieldGoalsAttempted3"), pair("Slobodna bacanja", "FreeThrowsMade", "FreeThrowsAttempted"),
    one("Skokovi", "TotalRebounds"), one("Skokovi u napadu", "OffensiveRebounds"), one("Skokovi u odbrani", "DefensiveRebounds"), one("Asistencije", "Assistances"),
    one("Ukradene lopte", "Steals"), one("Blokade", "BlocksFavour"), one("Izgubljene lopte", "Turnovers"), one("Faulovi", "FoulsCommited"), one("PIR", "Valuation")];
}

async function showElMatch(c, code, tab) {
  const m = $("#main");
  if (m.dataset.shown !== location.hash) m.innerHTML = back() + `<div class="empty spin">Učitavam…</div>`;
  m.dataset.shown = location.hash;
  try {
    const j = await getJSON("el.json?" + Math.floor(Date.now() / 300000), 120);
    const g = j.games.find(x => x.c === c && String(x.code) === String(code));
    if (!g) throw new Error("utakmica nije pronađena");
    const start = Date.parse(g.utc);
    const e = { league: { name: j.comps[c] || c }, round: g.round, start, st: g.played ? { k: "ft", label: "Kraj" } : { k: "ns" },
      home: { name: g.h.name, logo: g.h.logo }, away: { name: g.a.name, logo: g.a.logo },
      hs: g.played ? g.hs : null, as: g.played ? g.as : null, sets: g.played ? [g.hp, g.ap] : null };
    const now = Date.now();
    const season = `${c}${j.season}`;
    const running = !g.played && start <= now + 60000 && now - start < 4 * 36e5;
    if (running) {
      try {
        const h = await getJSON(`https://live.euroleague.net/api/Header?gamecode=${code}&seasoncode=${season}`, 8);
        const q = [1, 2, 3, 4].map(i => [num(h["ScoreQuarter" + i + "A"]), num(h["ScoreQuarter" + i + "B"])]);
        const per = k => { let prev = 0; const o = []; for (const v of q.map(x => x[k])) { if (!v || v <= 0) break; o.push(v - prev); prev = v; } return o; };
        if (h.Live) { const qq = String(h.Quarter || "").trim(); e.st = { k: "live", label: (/^\d+$/.test(qq) ? "Q" + qq : qq) + " " + String(h.RemainingPartialTime || "").trim() }; e.hs = num(h.ScoreA); e.as = num(h.ScoreB); e.sets = [per(0), per(1)]; }
        else if ((num(h.ScoreA) || 0) > 0 && now - start > 90 * 60000) { e.st = { k: "ft", label: "Kraj" }; e.hs = num(h.ScoreA); e.as = num(h.ScoreB); e.sets = [per(0), per(1)]; }
      } catch (err) {}
    }
    let box = null;
    if (e.st.k !== "ns") { try { box = await getJSON(`https://live.euroleague.net/api/Boxscore?gamecode=${code}&seasoncode=${season}`, e.st.k === "live" ? 8 : 300); } catch (err) {} }
    const S = (box && box.Stats) || [];
    const teamStats = S.length >= 2 && S[0].totr && S[1].totr ? `<div class="panel">${statsHtml([{ title: "Timovi", items: elTeamStats(S[0].totr, S[1].totr) }])}</div>` : "";
    const cols = ["MIN", "PTS", "REB", "AST", "STL", "BLK", "TO", "2P", "3P", "FT", "PIR", "+/-"];
    const players = S.slice(0, 2).map((t, i) => boxHtml(i === 0 ? e.home.name : e.away.name, cols, (t.PlayersStats || []).filter(p => p.Minutes && p.Minutes !== "DNP").map(p => ({
      name: elName(p.Player), no: p.Dorsal, starter: p.IsStarter === 1,
      v: [String(p.Minutes || "").split(":")[0], p.Points, p.TotalRebounds, p.Assistances, p.Steals, p.BlocksFavour, p.Turnovers,
        `${p.FieldGoalsMade2}/${p.FieldGoalsAttempted2}`, `${p.FieldGoalsMade3}/${p.FieldGoalsAttempted3}`, `${p.FreeThrowsMade}/${p.FreeThrowsAttempted}`, p.Valuation, p.Plusminus],
    })))).join("");
    const info = [box && box.Referees ? "Sudije: " + box.Referees : "", box && box.Attendance && box.Attendance !== "0" ? "Gledalaca: " + box.Attendance : ""].filter(Boolean);
    const cur = tab === "pl" ? "pl" : "st";
    let body;
    if (e.st.k === "ns") body = `<div class="panel"><div class="note">Statistika će biti dostupna kad utakmica počne.</div></div>`;
    else body = cur === "pl" ? (players || `<div class="panel"><div class="note">Statistika igrača nije dostupna.</div></div>`) : (teamStats || `<div class="panel"><div class="note">Statistika još nije dostupna.</div></div>`);
    const tabs = e.st.k === "ns" ? "" : `<div class="tabs">${[["st", "Statistika"], ["pl", "Igrači"]].map(([k, l]) => `<a class="chip ${k === cur ? "on" : ""}" href="#/m/el/${c}/${code}/${k}">${l}</a>`).join("")}</div>`;
    m.innerHTML = back() + hdr(e, setsRow(e)) + (tabs || `<div style="height:12px"></div>`) + body + (info.length ? `<div class="note">${info.map(esc).join("<br>")}</div>` : "");
    detailTimer(() => showElMatch(c, code, cur), e.st.k === "live" ? 10 : 0);
  } catch (err) { m.innerHTML = back() + `<div class="err">Utakmica nije dostupna (${esc(err.message)})</div>`; }
}

/* ---------- routing ---------- */
let dtimer = null;
function detailTimer(fn, sec) {
  clearTimeout(dtimer);
  if (sec > 0) dtimer = setTimeout(async () => {
    if (document.hidden) { detailTimer(fn, sec); return; }
    const y = window.scrollY; await fn(); window.scrollTo(0, y);
  }, sec * 1000);
}
let lastScroll = 0;
function route() {
  clearTimeout(dtimer);
  const h = location.hash || "#/";
  let r;
  if ((r = /^#\/m\/fm\/(\d+)(?:\/(\w+))?$/.exec(h))) showFmMatch(r[1], r[2]);
  else if ((r = /^#\/m\/espn\/([\w-]+\/[\w.-]+)\/(\d+)(?:\/(st|pl))?$/.exec(h))) showEspnMatch(r[1], r[2], r[3]);
  else if ((r = /^#\/m\/el\/(\w+)\/(\d+)(?:\/(st|pl))?$/.exec(h))) showElMatch(r[1], r[2], r[3]);
  else if ((r = /^#\/l\/(\d+)$/.exec(h))) showLeague(r[1]);
  else { $("#main").dataset.shown = ""; renderList(); window.scrollTo(0, lastScroll); return; }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
window.addEventListener("scroll", () => { if (!location.hash || location.hash === "#/") lastScroll = window.scrollY; }, { passive: true });

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-sp],[data-d],[data-live]");
  if (b) {
    if (b.dataset.sp) { state.sport = b.dataset.sp; try { localStorage.setItem("ks.sport", state.sport); } catch (e) {} state.events = []; }
    if (b.dataset.d !== undefined) { const n = +b.dataset.d; state.date = n === 0 ? new Date() : new Date(state.date.getTime() + n * 864e5); state.events = []; }
    if (b.dataset.live) { state.liveOnly = !state.liveOnly; renderList(); return; }
    if (location.hash && location.hash !== "#/") { location.hash = "#/"; }
    lastScroll = 0;
    refresh(false);
    return;
  }
});

setInterval(() => {
  if (document.hidden) return;
  if (location.hash && location.hash !== "#/") return;
  const live = state.events.some(e => e.st.k === "live");
  if (sameDay(state.date, new Date()) && (live || Date.now() - (refresh.last || 0) > 60000)) { refresh.last = Date.now(); refresh(true); }
}, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && (!location.hash || location.hash === "#/")) refresh(true); });

renderChrome();
route();
refresh(false);
</script>
