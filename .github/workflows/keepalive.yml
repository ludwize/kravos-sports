name: keepalive

# GitHub disables scheduled workflows after 60 days without a commit. Once a month this
# writes today's date to a tiny file so the web page keeps refreshing.
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > .github/keepalive.txt
          git config user.name "ci"
          git config user.email "ci@kravos.invalid"
          git add .github/keepalive.txt
          git commit -qm "keepalive" || exit 0
          git push -q
